<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VR PC Cable Connect Lab</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0b1220;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 20;
      color: white;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      padding: 12px 14px;
      max-width: 430px;
      line-height: 1.45;
      font-size: 14px;
    }

    #hud b { font-size: 15px; }
    #hud .muted { opacity: .82; font-size: 12px; }
    #hud .sel { color: #ffd166; }
    #hud .ok { color: #73ff9f; }
    #hud .bad { color: #ff8c8c; }

    #message {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 20;
      color: white;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      padding: 10px 12px;
      max-width: 540px;
      min-height: 20px;
      white-space: pre-line;
      font-size: 14px;
    }

    #resetBtn {
      margin-top: 10px;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    #resetBtn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div><b>VR Lab</b></div>
    
    <div>Төлөв: <span id="status">Model ачаалж байна...</span></div>
 
  </div>

  <div id="message">Model ачаалж байна...</div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { VRButton } from "three/addons/webxr/VRButton.js";

    // ==================================================
    // DOM
    // ==================================================
    const selectedCableEl = document.getElementById("selectedCable");
    const selectedPortEl = document.getElementById("selectedPort");
    const scoreEl = document.getElementById("score");
    const statusEl = document.getElementById("status");
    const messageEl = document.getElementById("message");
    const resetBtn = document.getElementById("resetBtn");

    function setMessage(msg) {
      messageEl.textContent = msg;
    }

    // ==================================================
    // SCENE
    // ==================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1220);

    const camera = new THREE.PerspectiveCamera(
      65,
      window.innerWidth / window.innerHeight,
      0.01,
      100
    );
    camera.position.set(0, 1.6, 3.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.7, 0);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x223344, 1.2);
    scene.add(hemi);

    const dir1 = new THREE.DirectionalLight(0xffffff, 1.2);
    dir1.position.set(5, 8, 6);
    scene.add(dir1);

    const dir2 = new THREE.DirectionalLight(0xffffff, 0.45);
    dir2.position.set(-4, 3, -5);
    scene.add(dir2);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({
        color: 0x101826,
        roughness: 0.95,
        metalness: 0.05
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    scene.add(floor);

    const grid = new THREE.GridHelper(20, 20, 0x2f5f9f, 0x1a3152);
    grid.position.y = 0.001;
    scene.add(grid);
// ==================================================
// TABLE
// ==================================================
const TABLE_TOP_Y = 0.78;

const tableGroup = new THREE.Group();
scene.add(tableGroup);
tableGroup.position.z = -1.2; // ---- ширээг хойшлуулна
tableGroup.position.x = -1.2;
const tableTop = new THREE.Mesh(
  new THREE.BoxGeometry(4, 0.08,12),
  new THREE.MeshStandardMaterial({
    color: 0x6b7280,
    roughness: 0.85,
    metalness: 0.1
  })
);
tableTop.position.set(0, TABLE_TOP_Y, 0);
tableGroup.add(tableTop);

function createTableLeg(x, z) {
  const leg = new THREE.Mesh(
    new THREE.BoxGeometry(0.08, 0.78, 0.08),
    new THREE.MeshStandardMaterial({
      color: 0x4b5563,
      roughness: 0.85,
      metalness: 0.1
    })
  );
  leg.position.set(x, TABLE_TOP_Y / 2, z);
  tableGroup.add(leg);
}

createTableLeg(-3, -2);
createTableLeg( 3, -2);
createTableLeg(-3,  2);
createTableLeg( 3,  2);

    // ==================================================
    // HELPERS
    // ==================================================
    function makeLabelSprite(text, color = "#ffffff", bg = "rgba(0,0,0,0.7)") {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(255,255,255,0.25)";
      ctx.lineWidth = 4;
      ctx.strokeRect(6, 6, canvas.width - 12, canvas.height - 12);

      ctx.fillStyle = color;
      ctx.font = "bold 42px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({
        map: tex,
        transparent: true,
        depthTest: false,
        depthWrite: false
      });

      const sprite = new THREE.Sprite(mat);
      sprite.renderOrder = 999;
      return sprite;
    }

    function placeModelOnFloor(object3D) {
      const box = new THREE.Box3().setFromObject(object3D);
      object3D.position.y -= box.min.y;
    }

    function frameObject(object3D) {
      const box = new THREE.Box3().setFromObject(object3D);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();

      box.getSize(size);
      box.getCenter(center);

      const maxDim = Math.max(size.x, size.y, size.z);
      const fitHeightDistance = maxDim / (2 * Math.tan((Math.PI * camera.fov) / 360));
      const fitWidthDistance = fitHeightDistance / camera.aspect;
      const distance = 1.55 * Math.max(fitHeightDistance, fitWidthDistance);

      const direction = new THREE.Vector3(1, 0.55, 1).normalize();

      camera.position.copy(center).add(direction.multiplyScalar(distance));
      camera.near = Math.max(0.01, distance / 100);
      camera.far = distance * 100;
      camera.updateProjectionMatrix();

      controls.target.copy(center);
      controls.update();
    }

    function addTopLabel(targetObject, text) {
      const box = new THREE.Box3().setFromObject(targetObject);
      const center = new THREE.Vector3();
      box.getCenter(center);

      const worldPos = center.clone();
      worldPos.y = box.max.y + 0.06;

      const localPos = targetObject.worldToLocal(worldPos.clone());

      const label = makeLabelSprite(text);
      label.position.copy(localPos);
      label.scale.set(0.42, 0.10, 1);
      targetObject.add(label);

      return label;
    }

    function setPortState(port, state) {
      if (!port || !port.material) return;

      if (state === "idle") {
        port.material.color.set(0xff2d2d);
        port.material.emissive.set(0x550000);
      } else if (state === "selected") {
        port.material.color.set(0xffcc33);
        port.material.emissive.set(0x554400);
      } else if (state === "valid") {
        port.material.color.set(0x66ff88);
        port.material.emissive.set(0x114422);
      } else if (state === "invalid") {
        port.material.color.set(0xff6666);
        port.material.emissive.set(0x441111);
      } else if (state === "hover") {
        port.material.color.set(0xff8888);
        port.material.emissive.set(0x772222);
      }
    }

    function createCodePort(name, deviceName, worldPos) {
      const port = new THREE.Mesh(
        new THREE.SphereGeometry(0.18, 15, 15),
        new THREE.MeshPhongMaterial({
          color: 0xff2d2d,
          emissive: 0x550000
        })
      );

      port.name = name;
      port.position.copy(worldPos);

      port.userData = {
        kind: "port",
        deviceType: "pc",
        deviceName,
        connected: false
      };

      scene.add(port);
      return port;
    }

    function createCableSelector(parent, name, type, color, z) {
      const group = new THREE.Group();
      group.position.set(0, 0.48, z);
      parent.add(group);

      const mesh = new THREE.Mesh(
        new THREE.TorusGeometry(0.16, 0.04, 18, 40),
        new THREE.MeshPhongMaterial({ color })
      );
      mesh.rotation.x = Math.PI / 2;
      mesh.userData = {
        kind: "cableSelector",
        cableType: type,
        label: name
      };
      group.add(mesh);

      const label = makeLabelSprite(name);
      label.position.set(0.72, 0.12, 0);
      label.scale.set(0.75, 0.15, 1);
      group.add(label);

      interactables.push(mesh);
      return group;
    }

    function createCableCurve(start, end, color) {
      const mid = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
      mid.y += 0.18;

      const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
      const points = curve.getPoints(56);

      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({ color });
      const line = new THREE.Line(geometry, material);
      line.renderOrder = 10;

      scene.add(line);
      return { line, curve };
    }

    function addPacketFlow(curve, color = 0x73ff9f) {
      const packet = new THREE.Mesh(
        new THREE.SphereGeometry(0.022, 12, 12),
        new THREE.MeshBasicMaterial({ color })
      );
      packet.renderOrder = 20;
      scene.add(packet);

      packetFlows.push({
        mesh: packet,
        curve,
        t: Math.random(),
        speed: 0.014
      });
    }

    
    

    
    // ==================================================
    // MODEL LOAD
    // ==================================================
    const loader = new GLTFLoader();

    loader.load(
      "./lab4.glb",
      (gltf) => {
        modelRoot = gltf.scene;

        modelRoot.traverse((obj) => {
          if (obj.isMesh && obj.material) {
            obj.material = obj.material.clone();
          }
        });

        scene.add(modelRoot);

        // Моделийн хэмжээг багасгана
        scene.add(modelRoot);

// ==================================================
// MODEL SIZE
// ==================================================
modelRoot.scale.set(1, 1, 1);

// ==================================================
// MODEL PLACE ON TABLE
// ==================================================
const modelBoxBefore = new THREE.Box3().setFromObject(modelRoot);
modelRoot.position.y += TABLE_TOP_Y - modelBoxBefore.min.y + 0.8;   
modelRoot.position.z -= 1.3; 

        PC1 = modelRoot.getObjectByName("PC1");
        PC2 = modelRoot.getObjectByName("PC2");

        if (!PC1 || !PC2) {
          console.error("PC1 or PC2 not found", { PC1, PC2 });
          statusEl.textContent = "Object нэр олдсонгүй";
          setMessage("GLB дотор PC1, PC2 нэртэй объект байхгүй байна.");
          return;
        }

        // ---------- PC1 world box ----------
        const box1 = new THREE.Box3().setFromObject(PC1);

        // ---------- PC2 world box ----------
        const box2 = new THREE.Box3().setFromObject(PC2);

        // ---------- Кодын аргаар улаан портууд нэмнэ ----------
        // monitor-ийн баруун доод тал орчимд тавьж байна
        const pc1PortWorld = new THREE.Vector3(
          box1.max.x - 0.70,
          box1.min.y + 0.10,
          box1.max.z - 0.05
        );

        const pc2PortWorld = new THREE.Vector3(
          box2.max.x - 0.40,
          box2.min.y + 0.10,
          box2.max.z - 0.05
        );

        PC1_PORT = createCodePort("PC1_Port", "PC1", pc1PortWorld);
        PC2_PORT = createCodePort("PC2_Port", "PC2", pc2PortWorld);

        ports.push(PC1_PORT, PC2_PORT);
        interactables.push(PC1_PORT, PC2_PORT);

        addTopLabel(PC1, "PC1");
        addTopLabel(PC2, "PC2");

        frameObject(modelRoot);
controls.target.y = TABLE_TOP_Y + 0.12;
camera.position.y += 0.25;

        statusEl.textContent = "Бэлэн";
        setMessage("Model ачааллаа.\nУлаан портууд кодоор нэмэгдлээ.\nЭхлээд кабель сонго, дараа нь 2 порт сонго.");
        updateUI();
      },
      undefined,
      (err) => {
        console.error(err);
        statusEl.textContent = "Model ачаалж чадсангүй";
        setMessage("glb файл олдсонгүй эсвэл ачаалж чадсангүй.");
      }
    );

    // ==================================================
    // DESKTOP RAYCAST
    // ==================================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    renderer.domElement.addEventListener("pointerdown", (e) => {
      if (renderer.xr.isPresenting) return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(interactables, false);

      if (hits.length > 0) {
        handleSelection(hits[0].object);
      }
    });

    function updateHoverFromRay(raycasterObj) {
      const hits = raycasterObj.intersectObjects(interactables, false);
      const hit = hits[0]?.object;

      if (
        selectedHighlight &&
        selectedHighlight !== hit &&
        !selectedHighlight.userData.connected &&
        selectedHighlight !== firstPort
      ) {
        setPortState(selectedHighlight, "idle");
      }

      if (hit && hit.userData.kind === "port" && hit !== firstPort && !hit.userData.connected) {
        selectedHighlight = hit;
        setPortState(hit, "hover");
      } else {
        selectedHighlight = null;
      }
    }

    renderer.domElement.addEventListener("pointermove", (e) => {
      if (renderer.xr.isPresenting) return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      updateHoverFromRay(raycaster);
    });

    // ==================================================
    // VR CONTROLLER
    // ==================================================
    const controller = renderer.xr.getController(0);
    scene.add(controller);

    const laserGeometry = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0, -1)
    ]);

    const laser = new THREE.Line(
      laserGeometry,
      new THREE.LineBasicMaterial({ color: 0xffffff })
    );
    laser.scale.z = 10;
    controller.add(laser);

    const tempMatrix = new THREE.Matrix4();
    const vrRaycaster = new THREE.Raycaster();

    controller.addEventListener("selectstart", () => {
      tempMatrix.identity().extractRotation(controller.matrixWorld);
      vrRaycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      vrRaycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

      const hits = vrRaycaster.intersectObjects(interactables, false);
      if (hits.length > 0) {
        handleSelection(hits[0].object);
      }
    });

    // ==================================================
    // RESIZE
    // ==================================================
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    resetBtn.addEventListener("click", resetLab);

   
  </script>
</body>

</html>
